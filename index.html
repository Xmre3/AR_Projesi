<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Canlı Çizimler AR</title>
  
  <!-- A-Frame ve MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
    }

    /* Başlangıç Ekranı */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    .modal-card {
      max-width: 360px;
      padding: 32px 24px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      backdrop-filter: blur(16px);
    }

    h1 { font-size: 22px; margin-bottom: 12px; font-weight: 700; }
    p { font-size: 15px; line-height: 1.5; color: #bbb; margin-bottom: 24px; }

    #start-btn {
      width: 100%;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      background: #0071e3;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.4);
    }
    #start-btn:active { background: #005bb5; }

    /* Kamera Tarama Kılavuz Çerçevesi */
    #scan-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250px;
      height: 250px;
      border: 2px dashed rgba(255, 255, 255, 0.35);
      border-radius: 20px;
      pointer-events: none;
      display: none;
      z-index: 50;
    }

    /* Ekranda Sabit Duran Ko-fi Destek Butonu */
    #fixed-donate-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px); /* Başlangıçta ekran dışı */
      opacity: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      background: #ff5e5b;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 50px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(255, 94, 91, 0.4);
      z-index: 1000;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #fixed-donate-btn.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #fixed-donate-btn:active {
      transform: translateX(-50%) scale(0.95);
    }

    #fixed-donate-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <!-- Başlangıç Ekranı -->
  <div id="overlay">
    <div class="modal-card">
      <h1>AR Deneyimini Başlat</h1>
      <p>Kameranızı çizime doğrultarak animasyonu canlandırabilirsiniz.</p>
      <button id="start-btn">Kamerayı Aç</button>
    </div>
  </div>

  <div id="scan-box"></div>

  <!-- Ekranda Sabit Duran Destek Butonu (SVG Fincan İkonlu) -->
  <a id="fixed-donate-btn" href="https://ko-fi.com/seninkullaniciadin" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24">
      <path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/>
    </svg>
    <span>Sanatçıya Destek Ol (Apple Pay)</span>
  </a>

  <!-- AR Sahnesi -->
  <a-scene 
    id="ar-scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets id="asset-container"></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <script>
    const sceneEl = document.getElementById('ar-scene');
    const assetContainer = document.getElementById('asset-container');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const scanBox = document.getElementById('scan-box');
    const donateBtn = document.getElementById('fixed-donate-btn');

    async function initAR() {
      try {
        const response = await fetch('./manifest.json');
        const items = await response.json();

        items.forEach(item => {
          // 1. Dinamik Video Öğesi
          const video = document.createElement('video');
          video.setAttribute('id', `vid-${item.id}`);
          video.setAttribute('data-src', item.video);
          video.setAttribute('loop', 'true');
          video.setAttribute('playsinline', '');
          video.setAttribute('webkit-playsinline', '');
          video.setAttribute('preload', 'none');
          assetContainer.appendChild(video);

          // 2. MindAR Hedef Entity
          const targetEntity = document.createElement('a-entity');
          targetEntity.setAttribute('mindar-image-target', `targetIndex: ${item.id}`);
          targetEntity.setAttribute('class', 'ar-item');

          // 3. Video Düzlemi
          const videoPlane = document.createElement('a-video');
          videoPlane.setAttribute('src', `#vid-${item.id}`);
          videoPlane.setAttribute('width', item.width || 1.0);
          videoPlane.setAttribute('height', item.height || 1.0);
          videoPlane.setAttribute('position', item.position || '0 0 0.01');
          videoPlane.setAttribute('rotation', item.rotation || '0 0 0');
          targetEntity.appendChild(videoPlane);

          sceneEl.appendChild(targetEntity);

          // Çizim göründüğünde: Video başlar, sabit buton ekrana yukarı fırlar
          targetEntity.addEventListener('targetFound', () => {
            scanBox.style.display = 'none';
            donateBtn.classList.add('visible');

            if (!video.getAttribute('src')) {
              video.setAttribute('src', video.getAttribute('data-src'));
              video.load();
            }

            video.play().catch(() => {
              video.muted = true;
              video.play();
            });
          });

          // Çizim kadrajdan çıktığında: Video durur (İsteğe bağlı: Buton ekranda kalmaya devam eder)
          targetEntity.addEventListener('targetLost', () => {
            scanBox.style.display = 'block';
            video.pause();
            // Butonun çizim kaybolunca gizlenmesini istersen aşağıdaki satırı açabilirsin:
            // donateBtn.classList.remove('visible');
          });
        });
      } catch (err) {
        console.error('manifest.json okunurken hata oluştu:', err);
      }
    }

    startBtn.addEventListener('click', async () => {
      overlay.style.display = 'none';
      scanBox.style.display = 'block';

      const arSystem = sceneEl.systems['mindar-image-system'];
      await arSystem.start();
    });

    initAR();
  </script>
</body>
</html>
